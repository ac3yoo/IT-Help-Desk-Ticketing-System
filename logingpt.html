<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>AssisTechX</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="./css/login.css">
</head>

<body>

<div class="wrapper">
    <div class="container">
        <div class="form-box login">
            <form method="POST" id="login-form" onsubmit="return loginUser()">
                <h1>Login</h1>

                <div class="input-box">
                    <input type="text" id="email" name="email" placeholder="Email address" required>
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-box">
                    <input type="password" id="password" name="password" placeholder="Password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>

                <button type="submit" class="btn">Login</button>
                <p></p>

                <div class="forgot-link">
                    <a href="#">Forgot password?</a>
                </div>
            </form>
        </div>

        <div class="form-box register">
            <form method="POST" action="#">
                <h1>Register</h1>

                <div class="input-box">
                    <input type="text" name="name" placeholder="Name" required>
                    <i class='bx bxs-user'></i>
                </div>

                <div class="input-box">
                    <input type="text" name="email" placeholder="Email address" required>
                    <i class='bx bxs-envelope'></i>
                </div>

                <div class="input-box">
                    <input type="password" name="password" placeholder="Password" required>
                    <i class='bx bxs-lock-alt'></i>
                </div>

                <div class="input-box">
                    <input type="password" name="confirm_password" placeholder="Confirm Password" required>
                    <i class='bx bxs-check-circle'></i>
                </div>

                <button type="submit" name="register" class="btn">Register</button>
            </form>
        </div>

        <div class="toggle-box"> 
            <div class="toggle-panel toggle-left">
                <img class="styled-image" src="./assets/assistechx.png">
                <h1> Hello! Welcome to <br>Company's Help Desk</h1>
                <p> Don't have an account?</p>
                <button class="btn admin-btn">Register</button>
            </div>

            <div class="toggle-panel toggle-right">
                <img class="styled-image" src="./assets/assistechx.png">
                <h1> Create an Account</h1>
                <p>Already have an Account?</p>
                <button class="btn login-btn">Login</button>
            </div>
        </div>

    </div>
</div>

<script src="./js/login.js"></script>
<script>
    // Function to simulate the login process
    function loginUser(event) {
        event.preventDefault();  // Prevents form from submitting and refreshing the page

        // Get the entered email and password
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;

        // Simulate a predefined email and password (for demonstration purposes)
        var predefinedEmail = "user@example.com";
        var predefinedPassword = "password123";

        // Check if the entered email and password match the predefined ones
        if (email === predefinedEmail && password === predefinedPassword) {
            // Redirect to dashboard.html if login is successful
            window.location.href = "dashboard.html";
        } else {
            // If login fails, alert the user
            alert("Invalid email or password. Please try again.");
        }
    }
</script>
</body>
</html>
